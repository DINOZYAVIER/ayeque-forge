[package]
name = "ayeque-forge"
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
description = "Git-backed authoring and distribution for typed entities"

[workspace]
members = ["ayeque-forge-core"]

[dependencies]
ayeque-forge-core = { path = "ayeque-forge-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"
